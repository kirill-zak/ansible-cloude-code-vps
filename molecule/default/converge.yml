---
- name: Converge
  hosts: all
  # The podman driver already connects as root inside the container, so no
  # become escalation is needed. On the rootless podman available on GitHub
  # runners, sudo raises "PAM account management error" in the user
  # namespace, so connecting as root avoids sudo altogether.
  become: false
  vars:
    # The firewalld and ufw daemons are not available in the container test
    # runner, so only the file-based nftables ruleset (Alpine) is managed
    # during tests.
    firewall_manage: "{{ ansible_distribution == 'Alpine' }}"
    # Only the nftables config file is written and checked in the container
    # test runner; the nftables service must not be started there.
    firewall_service_manage: false
    # The fail2ban ban-service is not meaningful without a real init system in
    # the container test runner, so keep it disabled during tests too.
    protect_ssh_bruteforce: false
    # Automatic package updates rely on real init/package services (apt timers,
    # systemd timers, dcron) that the container test runner does not provide.
    auto_updates_enabled: false
    # swapon needs CAP_SYS_ADMIN, which the container test runner does not
    # have, so the swap file tasks are disabled during tests.
    swap_enabled: false
    # Rootless podman cannot use sudo to switch users; root -> code via su works.
    ansible_become_method: su
    manager_ssh_public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHbnX5Aeeid1mHN5BurVxP2SH8XrPZ7ZBHUMeN/AKnvA molecule-test@example"
    cloud_code_ssh_public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHbnX5Aeeid1mHN5BurVxP2SH8XrPZ7ZBHUMeN/AKnvA molecule-test@example"
  pre_tasks:
    - name: Wait for systemd to complete initialization.  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_service_mgr == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1
  tasks:
    - name: Include cloude_code_vps role
      ansible.builtin.include_role:
        name: cloude_code_vps