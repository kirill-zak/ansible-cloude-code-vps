---
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  listen: "restart sshd"

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: "restart fail2ban"

- name: Restart nftables
  ansible.builtin.service:
    name: nftables
    state: restarted
  listen: "restart nftables"
  when: firewall_service_manage | default(true) | bool