---
- name: Run preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Include user setup tasks
  ansible.builtin.include_tasks: users.yml

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks: ssh.yml

- name: Include firewall tasks
  ansible.builtin.include_tasks: firewall.yml

- name: Include fail2ban brute-force protection tasks
  ansible.builtin.include_tasks: fail2ban.yml
  when: protect_ssh_bruteforce

- name: Include automatic system update tasks
  ansible.builtin.include_tasks: auto_updates.yml
  when: auto_updates_enabled

- name: Include swap tasks
  ansible.builtin.include_tasks: swap.yml
  when: swap_enabled

- name: Include distro install tasks
  ansible.builtin.include_tasks: install/alpine.yml
  when: ansible_distribution == 'Alpine'

- name: Include AlmaLinux install tasks
  ansible.builtin.include_tasks: install/almalinux.yml
  when: ansible_distribution == 'AlmaLinux'

- name: Include Debian install tasks
  ansible.builtin.include_tasks: install/debian.yml
  when: ansible_distribution == 'Debian'

- name: Include Fedora install tasks
  ansible.builtin.include_tasks: install/fedora.yml
  when: ansible_distribution == 'Fedora'

- name: Include Rocky Linux install tasks
  ansible.builtin.include_tasks: install/rockylinux.yml
  when: ansible_distribution == 'Rocky'

- name: Include Ubuntu install tasks
  ansible.builtin.include_tasks: install/ubuntu.yml
  when: ansible_distribution == 'Ubuntu'

- name: Include tmux + Claude Code helper tasks
  ansible.builtin.include_tasks: cloud_code.yml