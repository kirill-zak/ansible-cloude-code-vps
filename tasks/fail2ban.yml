---
# fail2ban setup for SSH brute-force protection. Only runs when
# protect_ssh_bruteforce is true (see main.yml). In containerized Molecule
# tests the jail config is still deployed and validated; only the service
# start is gated off via fail2ban_service_manage.

- name: Resolve fail2ban ban action per distribution
  ansible.builtin.set_fact:
    fail2ban_banaction: "{{ fail2ban_banaction | default(_default_banaction) }}"
  vars:
    # firewalld on RHEL-family, ufw on Debian/Ubuntu, nftables on Alpine.
    _default_banaction: >-
      {{ 'firewallcmd-ipset'
         if ansible_distribution in ['AlmaLinux', 'Rocky', 'Fedora']
         else ('ufw' if ansible_distribution in ['Debian', 'Ubuntu'] else 'nftables-multiport') }}

- name: Ensure fail2ban is installed (Alpine)
  community.general.apk:
    name: fail2ban
    state: present
  when: ansible_distribution == 'Alpine'

- name: Ensure fail2ban is installed (Debian and Ubuntu)
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: Ensure fail2ban is installed (RHEL-based distributions)
  ansible.builtin.dnf:
    name: fail2ban
    state: present
  when: ansible_distribution in ['AlmaLinux', 'Rocky', 'Fedora']

- name: Deploy the fail2ban local jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    # Test the staged jail.local against a scratch copy of the installed
    # config, so it is merged with the stock jail.conf and jail.d
    # definitions exactly as fail2ban loads it. Works without a running
    # fail2ban server, on both fail2ban 0.11.x (whose client cannot test a
    # single file) and fail2ban 1.x.
    validate: sh -c 'd=$(mktemp -d) && trap "rm -rf $d" EXIT && cp -a /etc/fail2ban/. "$d" && cp %s "$d/jail.local" && fail2ban-server -c "$d" -t'
  notify: "restart fail2ban"

- name: Enable and start the fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_service_manage