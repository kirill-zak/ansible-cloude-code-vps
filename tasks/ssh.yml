---

- name: Ensure the OpenSSH server is installed (Alpine)
  community.general.apk:
    name: openssh
    state: present
  when: ansible_distribution == 'Alpine'

- name: Ensure the OpenSSH server is installed (Debian and Ubuntu)
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: Ensure the OpenSSH server is installed (RHEL-based distributions)
  ansible.builtin.dnf:
    name: openssh-server
    state: present
  when: ansible_distribution in ['AlmaLinux', 'Rocky', 'Fedora']

- name: Generate the SSH host keys (Alpine)
  ansible.builtin.command: ssh-keygen -A
  changed_when: false
  when: ansible_distribution == 'Alpine'

- name: Enable the sshd service
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
  when: ansible_distribution != 'Alpine'

- name: Enable the sshd service (Alpine openrc)
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
  when: ansible_distribution == 'Alpine'

- name: Harden sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    create: true
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: "Port", value: "{{ ssh_port }}" }
    - { key: "PermitRootLogin", value: "{{ 'no' if ssh_disable_root_login else 'yes' }}" }
    - { key: "PasswordAuthentication", value: "{{ 'no' if ssh_disable_password_auth else 'yes' }}" }
    - { key: "PubkeyAuthentication", value: "yes" }
    - { key: "X11Forwarding", value: "no" }
    - { key: "AllowTcpForwarding", value: "yes" }
    - { key: "AllowAgentForwarding", value: "{{ 'yes' if ssh_allow_agent_forwarding else 'no' }}" }
    - { key: "AllowUsers", value: "{{ ssh_allow_users | join(' ') }}" }
    - { key: "MaxAuthTries", value: "{{ ssh_max_auth_tries }}" }
    - { key: "MaxSessions", value: "10" }
    - { key: "ClientAliveInterval", value: "{{ ssh_client_alive_interval }}" }
    - { key: "ClientAliveCountMax", value: "{{ ssh_client_alive_count_max }}" }
    - { key: "LoginGraceTime", value: "{{ ssh_login_grace_time }}" }
    - { key: "PermitUserEnvironment", value: "{{ 'yes' if ssh_permit_user_environment else 'no' }}" }
    - { key: "UseDNS", value: "no" }
    - { key: "LogLevel", value: "VERBOSE" }
  notify: "restart sshd"

- name: Validate the final sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  register: sshd_config_validation
  changed_when: false
  failed_when: sshd_config_validation.rc != 0

- name: Ensure the sshd service is running after configuration
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
  when: ansible_distribution != 'Alpine'