---
- name: Check whether the swap file already exists
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_file_stat

- name: Create the swap file
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }}"
  when: not swap_file_stat.stat.exists
  changed_when: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Format the swap file
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file }}"
  when: not swap_file_stat.stat.exists
  changed_when: true

- name: Read the active swap devices
  ansible.builtin.slurp:
    src: /proc/swaps
  register: active_swap

- name: Enable the swap file
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when: swap_file not in (active_swap.content | b64decode)
  changed_when: true

- name: Persist the swap file in fstab
  ansible.posix.mount:
    path: "{{ swap_file }}"
    src: none
    fstype: swap
    opts: sw
    state: present
