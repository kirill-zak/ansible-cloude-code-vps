---
collections:
  # ansible 15.0.0 bundles ansible-core 2.22 and ships
  # community.general 14.0.1, so pin the same major line. An older pin would
  # shadow the bundled collection and trigger a duplicate-collection warning.
  - name: community.general
    version: '>=14.0.0,<15.0.0'

  # ansible.posix provides authorized_key, firewalld and mount.
  - name: ansible.posix
    version: '>=2.0.0,<3.0.0'
