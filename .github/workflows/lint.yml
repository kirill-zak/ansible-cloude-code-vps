---
name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install lint dependencies
        run: pip3 install -r requirements.txt

      - name: Install ansible dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run linter
        run: |
          yamllint .
          ansible-lint .

      - name: Verify the lockout guard
        run: |
          set +e
          output=$(ansible-playbook -i localhost, tests/negative-preflight.yml 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::preflight did not fail"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'manager_ssh_public_keys'; then
            echo "::error::preflight failed for the wrong reason"
            printf '%s\n' "$output"
            exit 1
          fi